<!--
  本插件的插件管理器图标（package.json 的 "icon" 声明，36×36 规格，见 DSH 官方实验插件同款）。

  画的是「聚合」：四条订阅线路（四枚节点）收进中心一块圆角方块（本插件那个统一的账号/订阅管理面）。
  取色都有出处，不新造品牌色：中心 #10A37F 是本仓库 src/client/hub/brand-icons.ts 里 chatgpt 那条
  线路的 tile 色（本插件正是以 ChatGPT 订阅起家的那条），线路节点与辐条用的 #7AC2FF → #4A65E8
  与 DSH 官方插件图形同一支渐变。图形为装饰性，不依赖 currentColor / CSS 变量，可安全地按 data: URI
  渲染在插件管理器的 <img> 里（PackageArtwork）。
-->
<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="url(#a)" stroke-width="2.8" stroke-linecap="round">
    <path d="M18 12.8V9.7" />
    <path d="M18 23.2V26.3" />
    <path d="M12.8 18H9.7" />
    <path d="M23.2 18H26.3" />
  </g>
  <circle cx="18" cy="6.6" r="3.1" fill="url(#a)" />
  <circle cx="18" cy="29.4" r="3.1" fill="url(#a)" />
  <circle cx="6.6" cy="18" r="3.1" fill="url(#a)" />
  <circle cx="29.4" cy="18" r="3.1" fill="url(#a)" />
  <rect x="12.25" y="12.25" width="11.5" height="11.5" rx="3.6" fill="#10A37F" />
  <defs>
    <linearGradient id="a" x1="7" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AC2FF" />
      <stop offset="1" stop-color="#4A65E8" />
    </linearGradient>
  </defs>
</svg>
